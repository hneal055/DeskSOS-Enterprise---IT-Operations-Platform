name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (TypeScript + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches the dev/production PC (npm 11)
          cache: 'npm'
          cache-dependency-path: backend/server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  client:
    name: Client (React build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11): npm 10 reads this lockfile differently and fails npm ci
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # CRA treats warnings as errors when CI=true; keep the build focused on real errors
          CI: false
