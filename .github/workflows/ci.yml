name: CI

on:
  push:
    branches: [main]
  # Every PR, whatever its base branch, so stacked PRs are tested too (plan 4.3)
  pull_request:

jobs:
  server:
    name: Server (TypeScript + Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches the dev/production PC (npm 11)
          cache: 'npm'
          cache-dependency-path: backend/server/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  client:
    name: Client (Vite build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Node 24 (npm 11): npm 10 reads this lockfile differently and fails npm ci
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        # Vitest + Testing Library (plan task 4.1)
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        # Fails on high or critical findings in what ships to the browser
        run: npm audit --omit=dev --audit-level=high
