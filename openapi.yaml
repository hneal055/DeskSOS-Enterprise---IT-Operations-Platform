openapi: 3.0.3
info:
  title: DeskSOS Enterprise API
  version: 1.0.0
  description: >
    Incident operations API for DeskSOS Enterprise (backend/server). Generated by hand
    from the code; docs/API_REFERENCE.md has the prose version. Placeholder endpoints
    that return sample data (/api/dashboard, /api/chat) are not described.
servers:
  - url: https://FORD-DC01:5543
    description: Production (office LAN, local CA)
  - url: http://localhost:5100
    description: Development
security:
  - bearerAuth: []
tags:
  - name: health
  - name: auth
  - name: incidents
  - name: admin-users
  - name: ingest

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness and database check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Database unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, maxLength: 256 }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Current user (allowed while a password change is pending)
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }

  /api/auth/change-password:
    post:
      tags: [auth]
      summary: Change your own password; returns a new token (earlier tokens stop working)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, maxLength: 256 }
                newPassword: { type: string, minLength: 12, maxLength: 256 }
      responses:
        "200":
          description: Changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401": { $ref: "#/components/responses/Error" }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: No-op (tokens are stateless; the client discards its token)
      security: []
      responses:
        "204": { description: Done }

  /api/incidents:
    get:
      tags: [incidents]
      summary: List the 500 newest incidents (any role)
      responses:
        "200":
          description: Incidents, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Incident" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [incidents]
      summary: Create an incident (operator, admin); emits incident:created
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}:
    patch:
      tags: [incidents]
      summary: Change an incident's status (operator, admin); emits incident:updated
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: "#/components/schemas/Status" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}/lock:
    post:
      tags: [incidents]
      summary: Lock an incident to the signed-in user (operator, admin); emits incident:locked
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Locked
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  lockedBy: { type: string }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/incidents/{id}/history:
    get:
      tags: [incidents]
      summary: An incident's audit trail, oldest first (any role)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IncidentEvent" }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/users:
    get:
      tags: [admin-users]
      summary: List users (admin)
      responses:
        "200":
          description: Users, active first, then by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AdminUser" }
        "403": { $ref: "#/components/responses/Error" }
    post:
      tags: [admin-users]
      summary: Create a user (admin); the server returns a one-time temporary password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, role]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                name: { type: string, minLength: 1, maxLength: 100 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithTemporaryPassword" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }

  /api/admin/users/{id}:
    patch:
      tags: [admin-users]
      summary: Change name, role or active state (admin). No delete; deactivate instead
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                role: { $ref: "#/components/schemas/Role" }
                active: { type: boolean }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUser" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/admin/users/{id}/reset-password:
    post:
      tags: [admin-users]
      summary: Issue a new temporary password and end the user's sessions (admin; not for yourself)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Reset
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserWithTemporaryPassword" }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }

  /api/ingest/incidents:
    post:
      tags: [ingest]
      summary: Machine intake, idempotent on (source, externalId); emits incident:created
      security:
        - apiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IngestIncident" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "200":
          description: Already received; the existing incident
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Incident" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        From POST /api/auth/login. Valid 8 hours; revoked immediately by a password
        change or reset, role change or deactivation. Until a pending password change is
        done, other endpoints return 403 with code PASSWORD_CHANGE_REQUIRED.
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: The server's INGEST_API_KEY (paired with rotate-ingest-key.ps1)

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
          example:
            error: Validation failed
            details: ["title: is required", "severity: must be one of CRITICAL, HIGH, MEDIUM, LOW"]

  schemas:
    Severity:
      type: string
      enum: [CRITICAL, HIGH, MEDIUM, LOW]
    Status:
      type: string
      enum: [Open, In Progress, Resolved]
    Role:
      type: string
      enum: [admin, operator, viewer]

    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, error] }
        timestamp: { type: string, format: date-time }
        services:
          type: object
          properties:
            database: { type: string, enum: [connected, unavailable] }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        details: { type: array, items: { type: string } }
        code: { type: string, example: PASSWORD_CHANGE_REQUIRED }

    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        mustChangePassword: { type: boolean }

    TokenResponse:
      type: object
      properties:
        token: { type: string }
        user: { $ref: "#/components/schemas/User" }

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            active: { type: boolean }
            createdAt: { type: string }
            lastLoginAt: { type: string, nullable: true }

    UserWithTemporaryPassword:
      type: object
      properties:
        user: { $ref: "#/components/schemas/AdminUser" }
        temporaryPassword: { type: string, description: Shown once; the user must change it at first sign-in }

    Incident:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        severity: { $ref: "#/components/schemas/Severity" }
        status: { $ref: "#/components/schemas/Status" }
        location:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
        assignedTo: { type: string }
        source: { type: string, description: "enterprise-ui, or the ingesting integration's source" }
        externalId: { type: string, nullable: true }
        requester: { type: string, nullable: true }
        lockedBy: { type: string, description: Only in list responses, while locked }
        created_at: { type: string }
        updated_at: { type: string }

    IncidentCreate:
      type: object
      required: [title, description]
      properties:
        title: { type: string, minLength: 1, maxLength: 255 }
        description: { type: string, minLength: 1, maxLength: 20000 }
        category: { type: string, maxLength: 100, default: Infrastructure }
        severity: { allOf: [{ $ref: "#/components/schemas/Severity" }], default: MEDIUM }
        status: { allOf: [{ $ref: "#/components/schemas/Status" }], default: Open }
        assignedTo: { type: string, maxLength: 100, default: Unassigned }
        location:
          type: object
          properties:
            latitude: { type: number, minimum: -90, maximum: 90, nullable: true }
            longitude: { type: number, minimum: -180, maximum: 180, nullable: true }

    IngestIncident:
      type: object
      required: [source, externalId, title, description]
      properties:
        source: { type: string, maxLength: 200, example: desksos-desktop-prod }
        externalId: { type: string, maxLength: 200, example: T-12345678 }
        title: { type: string, description: Trimmed; cut to 255 characters }
        description: { type: string, description: Trimmed; cut to 20000 characters }
        severity: { allOf: [{ $ref: "#/components/schemas/Severity" }], default: MEDIUM }
        category: { type: string, maxLength: 200, default: Desktop Support }
        requester: { type: string, maxLength: 200 }
        assignedTo: { type: string, maxLength: 200 }
        location:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }

    IncidentEvent:
      type: object
      properties:
        id: { type: integer }
        incidentId: { type: integer }
        action: { type: string, enum: [created, ingested, status_changed, locked] }
        actor:
          type: object
          properties:
            userId: { type: integer, nullable: true }
            name: { type: string }
            type: { type: string, enum: [user, integration] }
        details: { type: object, additionalProperties: true }
        createdAt: { type: string }
