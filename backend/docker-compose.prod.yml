version: "3.9"

services:
  server:
    container_name: desksos_server_prod
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env.prod
    networks:
      - desksos-prod
    restart: unless-stopped

  postgres:
    container_name: desksos_postgres_prod
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    networks:
      - desksos-prod
    restart: unless-stopped

  redis:
    container_name: desksos_redis_prod
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    networks:
      - desksos-prod
    restart: unless-stopped

  nginx:
    container_name: desksos_nginx_prod
    image: nginx:alpine
    depends_on:
      server:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    networks:
      - desksos-prod
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./ssl:/etc/nginx/ssl:ro
    command: /bin/sh -c "rm -f /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

networks:
  desksos-prod:
    driver: bridge
