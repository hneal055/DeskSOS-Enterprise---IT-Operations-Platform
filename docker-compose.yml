services:
  postgres:
    image: postgres:15-alpine
    container_name: desksos_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: desksos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: desksos_server
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: your-secret-key-change-this-in-production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: desksos
      DB_USER: postgres
      DB_PASSWORD: postgres
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
    command: npm run dev

  nginx:
    image: nginx:alpine
    container_name: desksos_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - desksos-network

  redis:
    image: redis:7-alpine
    container_name: desksos_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - desksos-network

volumes:
  postgres_data:
  redis_data:

networks:
  desksos-network:
    driver: bridge
version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: desksos-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: desksos_db
      POSTGRES_USER: desksos_user
      POSTGRES_PASSWORD: secure-db-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: desksos-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass secure-redis-password
    restart: unless-stopped

  localstack:
    image: localstack/localstack
    container_name: desksos-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEBUG=1
    volumes:
      - localstack_data:/var/lib/localstack
    restart: unless-stopped

  server:
    build:
      context: ./server
    container_name: desksos-server
    ports:
      - "32769:8000"
    environment:
      - PORT=8000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=desksos_db
      - DB_USER=desksos_user
      - DB_PASSWORD=secure-db-password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=secure-redis-password
      - AWS_ENDPOINT_URL=http://localstack:4566
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    depends_on:
      - db
      - redis
      - localstack
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: desksos-client
    ports:
      - "32768:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
